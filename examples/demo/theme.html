<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>agent-eyes demo: light and dark</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 16px system-ui; margin: 0; padding: 32px; background: #f4efe7; color: #2b2622; }
  @media (prefers-color-scheme: dark) { body { background: #1f1a16; color: #f1e8dc; } }
</style></head>
<body><h1>Follows the system theme</h1><p>Light by default, dark when the system asks for it.</p></body></html>
