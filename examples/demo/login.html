<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Log in</title>
<style>body { font: 16px system-ui; padding: 32px; background: #f4efe7; } input, button { font: inherit; padding: 8px; display: block; margin: 8px 0; }</style>
</head><body>
  <h1>Log in</h1>
  <form id="f">
    <input type="email" placeholder="email" required>
    <input type="password" placeholder="password" required>
    <button type="submit">Enter</button>
  </form>
  <script>
    document.getElementById("f").onsubmit = (e) => {
      e.preventDefault();
      document.cookie = "demo=1; path=/";
      setTimeout(() => location.replace("/"), 200);
    };
  </script>
</body></html>
