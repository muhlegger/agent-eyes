<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Lotline</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="auth">
<main class="auth-card">
  <h1>Lotline</h1>
  <p class="muted">Sign in to see this week's listings.</p>
  <form id="signin">
    <label>Email <input type="email" required autocomplete="username"></label>
    <label>Password <input type="password" required autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
</main>
<script type="module">import("/assets/login-chunk.js");</script>
</body>
</html>
